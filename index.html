<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Fincast · v0.1.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* Drop any stray SWs that could serve an old cached shell */
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (r) {
          r.forEach(function (x) {
            x.unregister();
          });
        });
      }
    </script>
    <div class="sky-blobs" aria-hidden="true">
      <div class="sky-blob sky-blob-1"></div>
      <div class="sky-blob sky-blob-2"></div>
      <div class="sky-blob sky-blob-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
